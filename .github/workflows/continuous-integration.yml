name: Continuous integration

on: [push, pull_request]

concurrency:
  group: environment-${{ github.head_ref }}
  cancel-in-progress: true

# Builds the kernels. The user space needs the Fuzix Compiler Kit, which is
# not packaged, so it is not built here.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        target: [trs80, trs80m2]
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    - name: install build deps
      run: |
        sudo apt-get update -q
        sudo apt-get install -y sdcc byacc
    - name: make
      run: make TARGET=${{ matrix.target }} kernel
